name: Vacancy feature code checks

on:
  push:
    branches:
      - draft/vacancy-salary-lmia-support
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/admin.js
          node --check public/app.js
          node --check scripts/test-vacancy-migration.js

      - name: Run isolated PostgreSQL migration tests
        if: ${{ secrets.TEST_DATABASE_URL != '' }}
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: npm run test:db

      - name: Explain skipped database tests
        if: ${{ secrets.TEST_DATABASE_URL == '' }}
        run: echo "Database tests skipped because TEST_DATABASE_URL is not configured."
