<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin | Canada Employment Portal</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="top"><div class="wrap nav"><a class="brand" href="/">Canada Employment Portal</a><a href="/">View public site</a></div></header>
<main class="wrap admin">
  <section id="loginPanel" class="panel narrow"><p class="eyebrow">PRIVATE AREA</p><h1>Administrator sign in</h1>
    <form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn" type="submit">Sign in</button><p id="loginResult" class="result" role="status"></p></form>
  </section>
  <section id="dashboard" hidden>
    <div class="section-head"><div><p class="eyebrow">RECRUITMENT MANAGEMENT</p><h1>Admin dashboard</h1></div><button id="logout" class="btn secondary">Sign out</button></div>
    <section class="panel"><h2>Publish a vacancy</h2><form id="jobForm" class="form-grid">
      <label>Job title *<input name="title" required maxlength="150"></label><label>Location *<input name="location" required maxlength="120" placeholder="City, Province"></label>
      <label>Employment type<input name="employmentType" value="Full-time"></label>
      <label class="full">Description *<textarea name="description" rows="4" required maxlength="3000"></textarea></label>
      <label class="full">Requirements<textarea name="requirements" rows="3" maxlength="3000"></textarea></label>
      <div class="full"><button class="btn" type="submit">Publish vacancy</button><p id="jobResult" class="result" role="status"></p></div>
    </form></section>
    <section class="section"><h2>Applications</h2><button class="btn secondary" id="loadApplications">Refresh applications</button><div id="applications" class="table-wrap"><p>Sign in to load records.</p></div></section>
  </section>
</main><script src="/admin.js"></script></body></html>
